name: RQ Checkin Workflow

on:
  schedule:
    # 每天 UTC 0:30（即北京时间每天早上 08:30）自动运行
    - cron: '30 0 * * *'
  workflow_dispatch: # 允许在 Actions 页面手动点击 Run workflow 触发

jobs:
  run-rq-checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run RQ Checkin
        env:
          # 从 Secrets 读取 RQ 签到凭证
          RQ_EMAIL: ${{ secrets.RQ_EMAIL }}
          RQ_PASSWORD: ${{ secrets.RQ_PASSWORD }}
          AESKEY: ${{ secrets.AESKEY }}
        run: |
          python3 scripts/rq_sign.py
