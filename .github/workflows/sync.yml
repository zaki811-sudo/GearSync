name: GearSync Workflow

on:
  schedule:
    # 每天 UTC 23:00（即北京时间每天早上 07:00）自动运行
    - cron: '0 23 * * *'
  workflow_dispatch: # 允许在 Actions 页面手动点击 Run workflow 触发

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Sync Script
        env:
          # 佳明国内区账号密码（从 Secrets 读取）
          GARMIN_CN_EMAIL: ${{ secrets.GARMIN_CN_EMAIL }}
          GARMIN_CN_PASSWORD: ${{ secrets.GARMIN_CN_PASSWORD }}
          # 佳明国际区账号密码（从 Secrets 读取）
          GARMIN_GLOBAL_EMAIL: ${{ secrets.GARMIN_GLOBAL_EMAIL }}
          GARMIN_GLOBAL_PASSWORD: ${{ secrets.GARMIN_GLOBAL_PASSWORD }}
          # 同步方向配置：佳明国内 -> 佳明国际
          SOURCE: 'GARMIN_CN'
          TARGET: 'GARMIN_GLOBAL'
          SYNC_ACTIVITY_START_TIME: ${{ secrets.SYNC_ACTIVITY_START_TIME }}
        run: |
          python main.py
