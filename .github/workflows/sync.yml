name: GearSync Workflow

on:
  schedule:
    # 每天 UTC 23:00（即北京时间每天早上 07:00）自动运行
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Sync Script
        env:
          # 佳明国内区账号密码
          GARMIN_CN_EMAIL: ${{ secrets.GARMIN_CN_EMAIL }}
          GARMIN_CN_PASSWORD: ${{ secrets.GARMIN_CN_PASSWORD }}
          # 佳明国际区账号密码
          GARMIN_GLOBAL_EMAIL: ${{ secrets.GARMIN_GLOBAL_EMAIL }}
          GARMIN_GLOBAL_PASSWORD: ${{ secrets.GARMIN_GLOBAL_PASSWORD }}
          # 同步方向与时间配置
          SOURCE: 'GARMIN_CN'
          TARGET: 'GARMIN_GLOBAL'
          SYNC_ACTIVITY_START_TIME: ${{ secrets.SYNC_ACTIVITY_START_TIME }}
        run: |
          cd scripts
          echo "🔎 正在自动探测并匹配同步脚本..."
          
          if [ -f "garmin_cn_to_garmin_global.py" ]; then
            echo "✅ 找到单向脚本: garmin_cn_to_garmin_global.py"
            python garmin_cn_to_garmin_global.py
          elif [ -f "sync.py" ]; then
            echo "✅ 找到通用脚本: sync.py"
            python sync.py
          elif [ -f "main.py" ]; then
            echo "✅ 找到通用脚本: main.py"
            python main.py
          else
            echo "❌ 未找到对应脚本！当前 scripts 目录下的文件有："
            ls -la
            exit 1
          fi
